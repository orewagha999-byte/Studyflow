<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F9FE">
  <title>StudyFlow</title>
  <meta name="description" content="Plan your homework, focus with a timer, log your work hours and save everything as a PDF.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2317224D'/%3E%3Crect x='6' y='17' width='20' height='7' fill='%23FFE45C'/%3E%3Crect x='6' y='8' width='13' height='3' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Main">
      <p class="brand">StudyFlow</p>
      <a class="nav-link" href="#today" data-view="today">Today</a>
      <a class="nav-link" href="#homework" data-view="homework">Homework</a>
      <a class="nav-link" href="#hours" data-view="hours"><span class="nav-extra">Work </span>hours</a>
      <a class="nav-link" href="#notes" data-view="notes">Notes</a>
      <a class="nav-link" href="#tips" data-view="tips">Tips</a>
      <a class="nav-link settings" href="#settings" data-view="settings">Settings</a>
    </nav>
    <main id="view" class="main" tabindex="-1"></main>
  </div>

  <div id="print-root" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem">StudyFlow needs JavaScript to run.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
