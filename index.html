<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060A">
  <title>STUDORA</title>
  <meta name="description" content="Plan your homework, focus with a Pomodoro timer, log your work hours and save everything as a PDF.">

<body>
  <div id="wallpaper" aria-hidden="true"></div>

  <div class="app">
    <aside class="side" id="side"></aside>
    <div class="scrim" data-act="menu-close"></div>
    <div class="shell">
